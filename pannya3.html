<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>●3514　後藤望杏●</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <a-scene>
    <!-- 背景を360度画像にする -->
    <a-sky src="pannya3.jpg"></a-sky>

    <!-- カメラ -->
    <a-entity id="camera" camera look-controls></a-entity>

    <script>
      document.querySelector('#camera').addEventListener('loaded', function () {
        this.setAttribute('rotation', '0 180 0');
      });
    </script>
  </a-scene>
  </a-entity>
</body>
</html>
